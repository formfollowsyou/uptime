# Upptime configuration
# Docs: https://upptime.js.org/docs/configuration

owner: formfollowsyou
repo: uptime

# Secrets allowlist (GitHub repo secrets: Settings -> Secrets and variables -> Actions)
secrets:
  - NOTIFICATION_SLACK
  - NOTIFICATION_SLACK_WEBHOOK_URL
  # Telegram-Notifications (Bot: ffyUpdate_bot, Gruppe: build.FormMonitoring)
  # NOTIFICATION_TELEGRAM = "true", NOTIFICATION_TELEGRAM_BOT_KEY = Bot-Token,
  # NOTIFICATION_TELEGRAM_CHAT_ID = Chat/Group-ID
  - NOTIFICATION_TELEGRAM
  - NOTIFICATION_TELEGRAM_BOT_KEY
  - NOTIFICATION_TELEGRAM_CHAT_ID
  # Optional: eigene Nachrichtentemplates (Platzhalter: $EMOJI, $SITE_NAME,
  # $SITE_URL, $STATUS, $ISSUE_URL, $RESPONSE_CODE)
  - NOTIFICATIONS_DOWN_MESSAGE
  - NOTIFICATIONS_UP_MESSAGE

sites:
  # ---- Haupt-Checks (rudimentär): Hauptseite, Kuma, Server ----
  - name: buildplace.io
    url: https://buildplace.io/
  - name: Kuma (Uptime Monitoring)
    url: https://uptime.beta.formfollowsyou.com/
  - name: beta.formfollowsyou.com
    url: https://devweb.beta.formfollowsyou.com/
  - name: staging.formfollowsyou.com
    url: https://web.staging.formfollowsyou.com/

status-website:
  # Privates Repo: publish:true noetig, damit die Status-Page deployed wird.
  # Sobald DNS fuer status.buildplace.io steht:  cname: status.buildplace.io  setzen und baseUrl entfernen.
  publish: true
  baseUrl: /uptime
  name: Buildplace
  logoUrl: https://raw.githubusercontent.com/formfollowsyou/uptime/master/assets/upptime-icon.svg
  introTitle: "**Buildplace** Status"
  introMessage: Uptime-Monitoring powered by Upptime. Checks laufen extern über GitHub Actions.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/formfollowsyou/uptime
